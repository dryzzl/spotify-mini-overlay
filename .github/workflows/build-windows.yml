name: Build Windows App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Compile native Windows executable
        shell: cmd
        run: call "Build Windows App.cmd"
      - name: Upload app and quick-start script
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyMiniOverlay-Windows
          path: |
            SpotifyMiniOverlay.exe
            Start Overlay.cmd
            README.md
          if-no-files-found: error
